# =============================================================================
# Arquivo de Configuração de Referência: Agrupamento Tabular Puro (Sem NLP)
# Use este modelo para projetos numéricos (ex: CRM, fraude, sensores, finanças)
# =============================================================================

projeto:
  nome: agrupamento_tabular_generico
  idioma: pt_BR

coleta:
  habilitada: true
  # Fonte de dados customizável: csv, parquet, jsonl ou local
  fonte: csv
  caminho_dados: "dados/amostra_tabular.csv"
  coluna_texto: "texto"
  coluna_id: "id"
  coluna_temporal: "data"

processamento:
  # Desativa todo o pipeline de processamento de texto (spaCy, BERTimbau, TF-IDF)
  usar_nlp: false

  # Define se o problema envolve dimensão temporal (janelas temporais) ou é estático/cross-sectional
  eh_temporal: false

  # Motor de processamento tabular desejado: polars ou pandas
  motor_dados: polars

  # Redução de dimensionalidade sobre as features numéricas (opcional)
  reducao:
    ativa: true
    tecnica: pca # Opções: pca, umap, svd, tsne
    componentes: 3
    random_state: 42

  # Técnicas de clusterização ativas para comparação
  tecnicas:
    kmeans:
      ativo: true
      parametros:
        n_clusters: 4
        random_state: 42
        n_init: 10
        init: k-means++
        k_automatico: true
        k_min: 2
        k_max: 8
        max_iter: 300
    dbscan:
      ativo: true
      parametros:
        eps: 0.5
        min_samples: 5
        metric: euclidean
        algorithm: auto
    hdbscan:
      ativo: true
      parametros:
        min_cluster_size: 5
        min_samples: 3
        metric: euclidean
        cluster_selection_method: eom

persistencia:
  tipo: s3
  bucket: dados-agrupamento-tabular
  # Configuração explícita dos caminhos/prefixos das camadas do Lakehouse
  caminhos:
    bronze: bronze
    prata: prata
    ouro: ouro
  prefixos:
    bronze: bronze
    prata: prata
    ouro: ouro
  endpoint_env: S3_ENDPOINT_URL
  access_key_env: AWS_ACCESS_KEY_ID
  secret_key_env: AWS_SECRET_ACCESS_KEY

mlflow:
  tracking_uri_env: MLFLOW_TRACKING_URI
  serving_url_env: MLFLOW_SERVING_URL

api:
  porta: 8000
  tempo_limite_segundos: 30
  cors_origens: ["*"]

observabilidade:
  prometheus: true
  grafana: true
  provedor_visualizacao: grafana # Opções: grafana, nenhum, custom
  url_visualizacao: "http://localhost:3000"
  labels_alta_cardinalidade: false

