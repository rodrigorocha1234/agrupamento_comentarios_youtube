clustering:
  motor: sklearn # sklearn | pycaret
  algoritmo: kmeans # kmeans | dbscan | hdbscan
  random_state: 42
  algoritmos:
    kmeans:
      n_clusters: 5
      init: k-means++
      n_init: auto
      max_iter: 300
    dbscan:
      eps: 0.5
      min_samples: 5
      metric: euclidean
    hdbscan:
      min_cluster_size: 15
      min_samples: null
      metric: euclidean
  tuning:
    habilitado: false
    estrategia: grid
    parametros: {}
  reproducibilidade:
    registrar_versoes: true
    registrar_configuracao: true
