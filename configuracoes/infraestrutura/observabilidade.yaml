observabilidade:
  ativado: true
  prometheus:
    porta_metricas: 8000
    caminho: /metrics
  logs:
    nivel: INFO
    formato: json
    incluir_correlacao: true
    mascarar_segredos: true
  metricas:
    prefixo: steam_clustering
    exportar_duracao_lotes: true
    exportar_paginas_consumidas: true
