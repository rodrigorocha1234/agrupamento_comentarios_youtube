datalake:
  ativado: true
  armazenamento: s3
  endpoint_url_env: S3_ENDPOINT_URL
  regiao_env: AWS_DEFAULT_REGION
  access_key_env: AWS_ACCESS_KEY_ID
  secret_key_env: AWS_SECRET_ACCESS_KEY
  bucket: ${DATA_BUCKET:-steam-reviews}
  camadas:
    bronze:
      prefixo: bronze/steam/reviews
      formato: json
      imutavel: true
    silver:
      prefixo: silver/steam/reviews
      formato: parquet
      reconciliar_historico: true
    gold:
      prefixo: gold/steam
      formato: parquet
