staging:
  ativado: true
  tecnologia: sqlite
  estrategia_escrita: upsert_versionado
  conexao:
    sqlite:
      caminho: ${STAGING_SQLITE_PATH:-./dados_staging/staging_steam.db}
      modo_journal: WAL
      timeout_segundos: 30
    postgres:
      url_env: STAGING_POSTGRES_DSN
  lote_registros: 500
  preservar_historico: true
  usar_outbox: true
  retencao_dias: 90
