[project]
name = "steam-reviews-clustering"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "requests>=2.32",
    "boto3>=1.35",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mlflow>=2.16",
    "prometheus-client>=0.20",
    "pyarrow>=17",
    "polars>=2.0",
    "plotly>=5.20",
    "httpx>=0.27",
    "spacy>=3.8",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.6"]
[tool.pyright]
typeCheckingMode = "strict"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["teste_*.py", "test_*.py"]
